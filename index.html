<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>
  <style>
    :root {
      --bg: #f3efe6;
      --card: #fffdf8;
      --ink: #1c1915;
      --muted: #6d665e;
      --line: #e3dbcf;
      --accent: #2a6b4a;
      --accent-ink: #ffffff;
      --danger: #8f3a31;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Iowan Old Style", Palatino, serif;
      background: var(--bg);
      color: var(--ink);
    }

    main {
      max-width: 32rem;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 2rem;
      font-weight: 600;
    }

    .lead {
      margin: 0 0 1.5rem;
      color: var(--muted);
    }

    form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      font: inherit;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      background: var(--card);
      color: inherit;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      border-radius: 0.5rem;
    }

    button.add {
      background: var(--accent);
      color: var(--accent-ink);
      padding: 0.65rem 1rem;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0.6rem;
      padding: 0.7rem 0.75rem;
    }

    li.done .title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .title { flex: 1; }

    button.delete {
      background: transparent;
      color: var(--danger);
      padding: 0.25rem 0.4rem;
    }

    .empty {
      color: var(--muted);
      background: transparent;
      border-style: dashed;
    }
  </style>
</head>
<body>
  <main>
    <h1>Task Tracker</h1>
    <p class="lead">Add a task, check it off, or remove it.</p>
    <form id="task-form">
      <input id="task-input" type="text" name="title" placeholder="New task" autocomplete="off" required>
      <button class="add" type="submit">Add</button>
    </form>
    <ul id="task-list" aria-label="Tasks"></ul>
  </main>
  <script>
    // Demo: harmless comment for BugBot PR review
    const form = document.getElementById("task-form");
    const input = document.getElementById("task-input");
    const list = document.getElementById("task-list");

    const tasks = [];
    let nextId = 1;

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const title = input.value.trim();
      if (!title) return;
      tasks.push({ id: nextId++, title, done: false });
      input.value = "";
      render();
      input.focus();
    });

    function toggleTask(id) {
      const task = tasks.find((item) => item.id === id);
      if (!task) return;
      task.done = !task.done;
      render();
    }

    function deleteTask(id) {
      // BUG: deletes wrong task
      const index = tasks.findIndex((item) => item.id === id);
      if (index === -1) return;
      const wrongIndex = (index + 1) % tasks.length;
      tasks.splice(wrongIndex, 1);
      render();
    }

    function render() {
      list.replaceChildren();

      if (tasks.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "No tasks yet.";
        list.append(empty);
        return;
      }

      for (const task of tasks) {
        const item = document.createElement("li");
        if (task.done) item.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", "Mark " + task.title + " complete");
        checkbox.addEventListener("change", () => toggleTask(task.id));

        const title = document.createElement("span");
        title.className = "title";
        title.textContent = task.title;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "delete";
        remove.textContent = "Delete";
        remove.setAttribute("aria-label", "Delete " + task.title);
        remove.addEventListener("click", () => deleteTask(task.id));

        item.append(checkbox, title, remove);
        list.append(item);
      }
    }

    render();
  </script>
</body>
</html>
